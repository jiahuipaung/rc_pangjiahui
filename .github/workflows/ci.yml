name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.1
          cache: true
      - run: make fmt
      - run: make vet
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0
      - run: make lint
      - run: make test
      - run: make test-race
      - run: go build ./cmd/notifier
      - run: docker build -f deployments/Dockerfile -t rc-notifier:${{ github.sha }} .

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notifier
          POSTGRES_PASSWORD: notifier
          POSTGRES_DB: notifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifier -d notifier"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: notifier
          RABBITMQ_DEFAULT_PASS: notifier
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://notifier:notifier@127.0.0.1:5432/notifier?sslmode=disable
      TEST_RABBITMQ_URL: amqp://notifier:notifier@127.0.0.1:5672/
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.1
          cache: true
      - run: go test -tags=integration -race -timeout=90s ./...
